name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [astro-migration]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，新的推送会取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache media derivatives
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-${{ hashFiles('content/posts/**/*.heic', 'content/posts/**/*.mov') }}
          restore-keys: |
            media-

      - name: Verify media tooling
        run: |
          # ffmpeg: required for HEIC HEVC decoding AND for MOV transcode (libx264).
          ffmpeg -hide_banner -codecs 2>&1 | grep -E 'libx264' >/dev/null \
            || (echo "ffmpeg missing libx264"; exit 1)
          # sharp: required for AVIF/WebP/JPEG output. AVIF is served via the heif format (output.alias contains 'avif').
          node -e "import('sharp').then(s => { if (!s.default.format.heif?.output?.file) { console.error('sharp HEIF/AVIF output missing'); process.exit(1); } })"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
