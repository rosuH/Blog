name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [astro-migration]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

# 同一时间只允许一个部署，新的推送会取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # Cold cache (after a media-code change or cache eviction) re-encodes every
    # content image to AVIF+WebP; allow headroom. Warm builds are ~1-2 min.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          # ffmpeg: MOV transcode (libx264) for Live Photo videos. HEIC stills are
          # decoded in-process by heic-convert (bundled WASM libheif), no apt needed.
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Cache generated image derivatives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/astro/assets
            .cache/media
          key: media-cache-v2-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs', 'src/utils/media-cache.mjs', 'src/utils/remark-media.mjs', 'src/utils/rehype-media.mjs', 'content/posts/**/*.png', 'content/posts/**/*.jpg', 'content/posts/**/*.jpeg', 'content/posts/**/*.webp', 'content/posts/**/*.gif', 'content/posts/**/*.heic', 'content/posts/**/*.mov') }}
          restore-keys: |
            media-cache-v2-${{ runner.os }}-

      - name: Verify media tooling
        run: |
          # ffmpeg: required for MOV transcode (libx264).
          ffmpeg -hide_banner -codecs 2>&1 | grep -E 'libx264' >/dev/null \
            || (echo "ffmpeg missing libx264"; exit 1)
          # heic-convert: decodes the Live Photo HEIC still (HEVC) via bundled WASM
          # libheif. Smoke-test a real decode of the actual content HEIC so a broken
          # dependency fails here, fast, with a clear message.
          node -e "
            import('heic-convert').then(async (m) => {
              const { readFile, readdir } = await import('node:fs/promises');
              const { join } = await import('node:path');
              const root = 'content/posts';
              const walk = async (d) => (await Promise.all((await readdir(d, { withFileTypes: true })).map(e => e.isDirectory() ? walk(join(d, e.name)) : [join(d, e.name)]))).flat();
              const heic = (await walk(root)).find(f => f.toLowerCase().endsWith('.heic'));
              if (!heic) return;
              const png = await m.default({ buffer: await readFile(heic), format: 'PNG' });
              if (!png || png.length < 1000) throw new Error('decoded output too small');
              console.log('heic-convert decode OK:', heic, png.length, 'bytes');
            }).catch(e => { console.error('heic-convert decode failed:', e.message); process.exit(1); });
          "
          # sharp: required for AVIF/WebP/JPEG output. Sharp exposes AVIF via the heif format
          # with output.alias containing 'avif' — probe both pieces explicitly.
          node -e "import('sharp').then(s => { const o = s.default.format.heif?.output; const ok = !!o?.file && Array.isArray(o?.alias) && o.alias.includes('avif'); if (!ok) { console.error('sharp AVIF output missing'); process.exit(1); } })"

      - name: Log image cache sizes
        run: |
          du -sh .cache/astro/assets .cache/media public/_media 2>/dev/null || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Astro site
        run: npm run build

      - name: Log generated image output sizes
        run: |
          du -sh .cache/astro/assets .cache/media public/_media dist/_astro dist/_media 2>/dev/null || true

      - name: Verify generated media references and privacy stripping
        run: node scripts/verify-pages-media.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
