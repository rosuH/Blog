name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [astro-migration]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，新的推送会取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg (static GPL build w/ HEIF demuxer + libx264)
        # ubuntu apt ffmpeg is too old (4.4) — its HEIF demuxer was added in
        # ffmpeg 5.0, so it can't decode iPhone HEVC HEIC. BtbN publishes
        # static GPL builds at HEAD with full codec coverage.
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | sudo tar -xJ --strip-components=1 -C /usr/local
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Cache generated image derivatives
        uses: actions/cache@v4
        with:
          path: |
            .cache/astro/assets
            .cache/media
          key: media-cache-v2-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs', 'src/utils/media-cache.mjs', 'src/utils/remark-media.mjs', 'src/utils/rehype-media.mjs', 'content/posts/**/*.png', 'content/posts/**/*.jpg', 'content/posts/**/*.jpeg', 'content/posts/**/*.webp', 'content/posts/**/*.gif', 'content/posts/**/*.heic', 'content/posts/**/*.mov') }}
          restore-keys: |
            media-cache-v2-${{ runner.os }}-

      - name: Verify media tooling
        run: |
          # ffmpeg: required for HEIC HEVC decoding AND for MOV transcode (libx264).
          ffmpeg -hide_banner -codecs 2>&1 | grep -E 'libx264' >/dev/null \
            || (echo "ffmpeg missing libx264"; exit 1)
          # sharp: required for AVIF/WebP/JPEG output. Sharp exposes AVIF via the heif format
          # with output.alias containing 'avif' — probe both pieces explicitly.
          node -e "import('sharp').then(s => { const o = s.default.format.heif?.output; const ok = !!o?.file && Array.isArray(o?.alias) && o.alias.includes('avif'); if (!ok) { console.error('sharp AVIF output missing'); process.exit(1); } })"

      - name: Log image cache sizes
        run: |
          du -sh .cache/astro/assets .cache/media public/_media 2>/dev/null || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build Astro site
        run: npm run build -- --force

      - name: Log generated image output sizes
        run: |
          du -sh .cache/astro/assets .cache/media public/_media dist/_astro dist/_media 2>/dev/null || true

      - name: Verify generated media references
        run: |
          node --input-type=module <<'NODE'
          import { access, readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';

          async function walk(dir) {
            const entries = await readdir(dir, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const path = join(dir, entry.name);
              if (entry.isDirectory()) files.push(...await walk(path));
              else files.push(path);
            }
            return files;
          }

          const htmlFiles = (await walk('dist')).filter((path) => path.endsWith('.html'));
          const missing = new Set();
          for (const file of htmlFiles) {
            const html = await readFile(file, 'utf8');
            for (const match of html.matchAll(/\/_media\/[^"'()\s,<>]+/g)) {
              const localPath = join('dist', match[0].slice(1));
              try {
                await access(localPath);
              } catch {
                missing.add(`${file}: ${match[0]}`);
              }
            }
          }

          if (missing.size > 0) {
            console.error('Missing generated media files referenced from HTML:');
            for (const item of [...missing].sort()) console.error(`- ${item}`);
            process.exit(1);
          }

          const target = 'dist/2026-04-25-year-end-summary/index.html';
          const targetHtml = await readFile(target, 'utf8');
          if (!targetHtml.includes('data-livephoto') || !targetHtml.includes('clip.h264.mp4')) {
            console.error(`${target} did not render the expected Live Photo markup.`);
            process.exit(1);
          }
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
