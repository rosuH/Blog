name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [astro-migration]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

# 同一时间只允许一个部署，新的推送会取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Install media tools (ffmpeg + libheif)
        run: |
          sudo apt-get update
          # ffmpeg: MOV transcode (libx264).
          sudo apt-get install -y --no-install-recommends ffmpeg
          # libheif (heif-convert) + HEVC decoder plugin (libde265) to decode the
          # Live Photo .heic still. Plugin package name varies across releases, so
          # try the modern plugin, then the legacy runtime; the verify step below
          # smoke-tests real decode capability and fails fast if it's still missing.
          sudo apt-get install -y libheif-examples libheif-plugin-libde265 \
            || sudo apt-get install -y libheif-examples libde265-0 \
            || sudo apt-get install -y libheif-examples \
            || true
          ffmpeg -version | head -1
          heif-convert --version 2>&1 | head -1 || true

      - name: Cache generated image derivatives
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/astro/assets
            .cache/media
          key: media-cache-v2-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs', 'src/utils/media-cache.mjs', 'src/utils/remark-media.mjs', 'src/utils/rehype-media.mjs', 'content/posts/**/*.png', 'content/posts/**/*.jpg', 'content/posts/**/*.jpeg', 'content/posts/**/*.webp', 'content/posts/**/*.gif', 'content/posts/**/*.heic', 'content/posts/**/*.mov') }}
          restore-keys: |
            media-cache-v2-${{ runner.os }}-

      - name: Verify media tooling
        run: |
          # ffmpeg: required for MOV transcode (libx264).
          ffmpeg -hide_banner -codecs 2>&1 | grep -E 'libx264' >/dev/null \
            || (echo "ffmpeg missing libx264"; exit 1)
          # heif-convert: decodes the Live Photo HEIC still (HEVC). Smoke-test a real
          # decode so a missing decoder plugin fails here, fast, with a clear message.
          HEIC=$(find content/posts -iname '*.heic' | head -1)
          if [ -n "$HEIC" ]; then
            heif-convert "$HEIC" /tmp/heic-probe.png >/dev/null 2>&1 && test -s /tmp/heic-probe.png \
              || (echo "heif-convert cannot decode HEVC HEIC (need libheif + libde265 plugin)"; exit 1)
          fi
          # sharp: required for AVIF/WebP/JPEG output. Sharp exposes AVIF via the heif format
          # with output.alias containing 'avif' — probe both pieces explicitly.
          node -e "import('sharp').then(s => { const o = s.default.format.heif?.output; const ok = !!o?.file && Array.isArray(o?.alias) && o.alias.includes('avif'); if (!ok) { console.error('sharp AVIF output missing'); process.exit(1); } })"

      - name: Log image cache sizes
        run: |
          du -sh .cache/astro/assets .cache/media public/_media 2>/dev/null || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Astro site
        run: npm run build

      - name: Log generated image output sizes
        run: |
          du -sh .cache/astro/assets .cache/media public/_media dist/_astro dist/_media 2>/dev/null || true

      - name: Verify generated media references and privacy stripping
        run: node scripts/verify-pages-media.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
